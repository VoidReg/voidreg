server {
    listen 80;
    server_name localhost;

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 7m;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    location = /sitemap-blogs.xml {
        proxy_pass http://api:8080/sitemap-blogs.xml;
        proxy_set_header Host $host;
    }
    location = /admin { return 301 /admin/; }
    location /admin/_app/immutable/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /admin/ {
        root /srv;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }
    location /_app/immutable/ {
        root /srv/web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /blog/ {
        root /srv/web;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /404.html;
    }
    location / {
        root /srv/web;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
