server {
    listen 80;
    server_name localhost;

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The scoped Rust bridge is reachable only on the Docker backend network.
    location ^~ /api/v1/mcp { return 404; }

    location = /mcp {
        proxy_pass http://mcp:8090/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 7m;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    location = /sitemap-blogs.xml {
        proxy_pass http://api:8080/sitemap-blogs.xml;
        proxy_set_header Host $host;
    }
    location = /admin { return 301 /admin/; }
    location /admin/_app/immutable/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /admin/ {
        root /srv;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }
    location /media/ { proxy_pass http://api:8080; }
    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

}
