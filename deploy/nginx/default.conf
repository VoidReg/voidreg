server {
    listen 80;
    server_name api.voidreg.xyz www.voidreg.xyz voidreg.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.voidreg.xyz www.voidreg.xyz voidreg.xyz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The scoped Rust bridge is reachable only on the Docker backend network.
    location ^~ /api/v1/mcp { return 404; }

    # The contact routes are called only by the web container over the Docker network, with a
    # shared token. Browsers never reach them, so nothing public can post to the form directly.
    location ^~ /api/v1/contact { return 404; }

    location = /mcp {
        proxy_pass http://mcp:8090/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    client_max_body_size 7m;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    location = /sitemap-blogs.xml {
        proxy_pass http://api:8080/sitemap-blogs.xml;
        proxy_set_header Host $host;
    }
    location = /admin { return 301 /admin/; }
    location /admin/_app/immutable/ {
        root /srv;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /admin/ {
        root /srv;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ /admin/index.html;
    }
    location /media/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

}

# Publisle PDF API, preserved alongside the publishing workspace.
# Proxies to the existing Publisle service on the host.
server {
    listen 80;
    server_name api.publisle.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.publisle.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.publisle.xyz;

    ssl_certificate     /etc/nginx/certs/publisle-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/publisle-privkey.pem;
    # Managed by Publisle's host sync; mounted read-only from /etc/publisle-nginx.
    include /etc/nginx/snippets/publisle-api-errors.conf;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://172.18.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 220s;
        proxy_send_timeout 220s;
        client_max_body_size 256k;
    }
}
