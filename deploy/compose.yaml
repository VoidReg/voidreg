name: voidreg

services:
  api:
    image: ghcr.io/voidreg/voidreg-api:${API_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      TURSO_LOCAL_PATH: /data/voidreg.db
    volumes:
      - api-data:/data
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  mcp:
    image: voidreg-mcp:${MCP_IMAGE_TAG:-local}
    build:
      context: ../voidreg-admin
      dockerfile: mcp/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8090"
      MCP_API_URL: http://api:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://www.voidreg.xyz}
    expose:
      - "8090"
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.75
    mem_limit: 768m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
      - ../voidreg-web/build:/srv/web:ro
      - ../voidreg-admin/build:/srv/admin:ro
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:

networks:
  edge:
  backend:
