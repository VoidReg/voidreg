name: voidreg

services:
  api:
    image: ghcr.io/voidreg/voidreg-api:${API_IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      TURSO_LOCAL_PATH: /data/voidreg.db
    volumes:
      - api-data:/data
    expose:
      - "8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:

networks:
  edge:
  backend:
    internal: true
