services:
  api:
    build:
      context: ../voidreg-api
  mcp:
    environment:
      PUBLIC_BASE_URL: http://localhost:8080
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes: !override
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../voidreg-web/build:/srv/web:ro
      - ../voidreg-admin/build:/srv/admin:ro
